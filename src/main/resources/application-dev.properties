# Development-only configuration (MVP-02 authentication).
# Active only under the "dev" Spring profile - never loaded in production
# (the Dockerfile activates the "prod" profile instead, see ../../Dockerfile).
#
# Seeds a single local user for authenticating during local development
# and testing. Override the defaults with environment variables so the
# credentials never need to be hardcoded or committed elsewhere.
app.security.dev-user.username=${DEV_USER_USERNAME:admin}
app.security.dev-user.password=${DEV_USER_PASSWORD:admin123}
