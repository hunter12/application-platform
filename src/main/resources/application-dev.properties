app.security.dev-user.username=${DEV_USER_USERNAME:admin}
app.security.dev-user.password=${DEV_USER_PASSWORD:admin123}

# Development database: file-based H2 stored under ./data (git-ignored),
# so data survives restarts without installing a database server.
# AUTO_SERVER lets external tools (e.g. IntelliJ) open it while the app runs.
spring.datasource.url=jdbc:h2:file:./data/devdb;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# H2 web console at http://localhost:8080/h2-console
# (JDBC URL: jdbc:h2:file:./data/devdb, user: sa, empty password)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
