server.port=${PORT:8080}
logging.level.org.atmosphere=warn

# Launch the default browser when starting the application in development mode
vaadin.launch-browser=true

# To improve the performance during development.
# For more information https://vaadin.com/docs/latest/flow/integrations/spring/configuration#special-configuration-parameters
vaadin.allowed-packages=com.vaadin,org.vaadin,com.flowingcode,application.platform

# Default profile for local development (see application-dev.properties).
# The Dockerfile runs the packaged jar with --spring.profiles.active=prod,
# which overrides this and keeps the dev-only seed user out of production.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
